# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing, so no
# token is stored anywhere: PyPI trusts this workflow in this repository.
name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
